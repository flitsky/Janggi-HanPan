<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <script>
        (function () {
            var targetOrigin = 'https://janggi-hanpan.app.rezen.dev';
            var projectPath = '/Janggi-HanPan';
            var path = window.location.pathname;

            if (window.location.hostname !== 'flitsky.github.io') {
                return;
            }

            if (path.indexOf(projectPath) === 0) {
                path = path.slice(projectPath.length) || '/';
            }

            window.location.replace(targetOrigin + path + window.location.search + window.location.hash);
        }());
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>장기 한판으로 이동 중</title>
</head>

<body>
    <p>
        새 주소로 이동 중입니다.
        <a href="https://janggi-hanpan.app.rezen.dev/">janggi-hanpan.app.rezen.dev</a>
    </p>
</body>

</html>
